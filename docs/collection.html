<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 작품 | (사)오늘은 아트 갤러리</title>
<meta name="description" content="(사)오늘은 소장 작품 전체 보기 — 검색, 작가별·연도별 보기">
<meta property="og:title" content="전체 작품 | (사)오늘은 아트 갤러리">
<meta property="og:description" content="(사)오늘은 소장 작품 전체 보기 — 검색, 작가별·연도별 보기">
<meta name="theme-color" content="#1F65B8">
<link rel="icon" href="assets/img/logo-symbol.png">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body data-page="collection">
<main>
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">Collection</span>
  <h1>전체 작품</h1>
  <p>작품명·작가명·재료로 검색하거나 작가별·연도별로 모아 보세요. 작품을 누르면 자세한 소개가 열립니다.</p>
</div></section>
<section class="block" style="padding-top:36px"><div class="wrap">
  <div id="col-notice"></div>
  <div class="toolbar">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr-only" for="q">작품 검색</label>
      <input id="q" type="search" placeholder="작품명, 작가명, 재료로 검색" autocomplete="off">
    </div>
    <span class="count" id="cnt"></span>
  </div>
  <div class="pills" id="pills" role="group" aria-label="프로젝트 필터" style="margin-bottom:12px"></div>

  <div class="tabs" role="tablist" style="margin-top:20px">
    <button role="tab" aria-selected="true" data-view="piece">Grid · 작품별</button>
    <button role="tab" aria-selected="false" data-view="artist">List · 작가별</button>
    <button role="tab" aria-selected="false" data-view="project">Project · 연도·프로젝트별</button>
  </div>
  <div id="col-grid"></div>
</div></section>
</main>
<script src="assets/config.js"></script>
<script src="assets/sample-data.js"></script>
<script src="assets/core.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/data.js"></script>
<script src="assets/gallery.js"></script>
<script src="assets/pages/collection.js"></script>
</body>
</html>
