<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방명록 | (사)오늘은 아트 갤러리</title>
<meta name="description" content="작품을 보고 느낀 점을 남겨주세요">
<meta property="og:title" content="방명록 | (사)오늘은 아트 갤러리">
<meta property="og:description" content="작품을 보고 느낀 점을 남겨주세요">
<meta name="theme-color" content="#1F65B8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231F65B8'/%3E%3Ccircle cx='23' cy='11' r='5' fill='%23A8ECE9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="guestbook">
<main>
<section class="page-hero"><div class="wrap">
  <span class="eyebrow">● Guestbook</span>
  <h1>방명록</h1>
  <p>작품 앞에서 느낀 마음을 짧게 남겨주세요. 남겨주신 글은 이 페이지에 공개됩니다.</p>
</div></section>
<section class="block" style="padding-top:36px"><div class="wrap">
  <div id="gb-notice" class="notice" style="display:none"></div>
  <div class="gb-layout">
    <form class="gb-form" id="gb-form" autocomplete="off">
      <h2>한 줄 남기기</h2>
      <p class="sub">개인정보(연락처 등)는 적지 말아 주세요.</p>
      <label for="gname">이름 (선택)</label>
      <input id="gname" name="gname" type="text" maxlength="20" placeholder="비워두면 ‘익명’으로 표시돼요">
      <label for="gb-msg">내용</label>
      <textarea id="gb-msg" name="message" maxlength="300" required placeholder="마음에 남은 작품이나 느낌을 적어주세요"></textarea>
      <input class="hp" type="text" name="website" tabindex="-1" aria-hidden="true">
      <div class="form-foot"><small id="gb-count">0 / 300</small><button class="btn btn-primary" id="gb-submit" type="submit">방명록 남기기</button></div>
    </form>
    <div><div class="msg-list" id="gb-list" aria-live="polite"></div></div>
  </div>
</div></section>
</main>
<script src="assets/config.js"></script>
<script src="assets/sample-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
